<head>

    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"></noscript>
    <!-- Google Tag Manager -->
    <script src="js/gtm-bootstrap.js"></script>
    <!-- End Google Tag Manager -->
    <title>تأكيد البريد الإلكتروني - MC PRIME NFC</title>
    <meta name="description" content="تأكيد البريد الإلكتروني - MC PRIME" />
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="auth.js?v=3.5"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 50px;
        }

        .auth-card {
            background: linear-gradient(145deg, var(--surface-color), #2a3d54);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(77, 166, 255, 0.1);
            text-align: center;
        }

        .status-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .status-icon.success {
            color: #4caf50;
        }

        .status-icon.error {
            color: #ff5252;
        }

        .status-icon.loading {
            color: #4DA6FF;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .auth-header h1 {
            color: #fff;
            margin-bottom: 10px;
            font-family: 'Cairo', sans-serif;
        }

        .auth-header p {
            color: var(--text-secondary-color);
        }

        .auth-footer {
            margin-top: 30px;
        }

        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="cookie-consent.css">
    <link rel="stylesheet" href="premium-ui.css">
  <link rel="icon" href="mc-prime-nfc.png" type="image/png">

    <link rel="canonical" href="https://www.mcprim.com/nfc/verify-email.html" />

    <link rel="alternate" hreflang="ar" href="https://www.mcprim.com/nfc/verify-email.html" />
    <link rel="alternate" hreflang="x-default" href="https://www.mcprim.com/nfc/verify-email.html" />
    <script src="lang-switcher.js" defer></script>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PLL5SLNM" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Navbar (Simplified) -->
    <nav class="navbar" style="background: rgba(28, 42, 59, 1);">
        <div class="container nav-content">
            <a href="index.html" class="nav-logo">
                <img src="mc-prime-nfc.png" alt="MC PRIME">
            </a>
            <a href="login.html" class="btn btn-secondary nav-cta">تسجيل الدخول</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div id="loading-state">
                <i class="fas fa-spinner status-icon loading"></i>
                <div class="auth-header">
                    <h1>جاري التحقق...</h1>
                    <p>يرجى الانتظار بينما نتحقق من بريدك الإلكتروني</p>
                </div>
            </div>

            <div id="success-state" style="display: none;">
                <i class="fas fa-check-circle status-icon success"></i>
                <div class="auth-header">
                    <h1>تم التحقق بنجاح! 🎉</h1>
                    <p>تم تأكيد بريدك الإلكتروني. يمكنك الآن استخدام جميع ميزات MC PRIME.</p>
                </div>
                <div class="auth-footer">
                    <a href="login.html" class="btn btn-primary">تسجيل الدخول الآن</a>
                </div>
            </div>

            <div id="error-state" style="display: none;">
                <i class="fas fa-times-circle status-icon error"></i>
                <div class="auth-header">
                    <h1>فشل التحقق</h1>
                    <p id="error-message">رابط التحقق غير صالح أو منتهي الصلاحية.</p>
                </div>
                <div class="auth-footer">
                    <a href="login.html">العودة لتسجيل الدخول</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/verify-email-548907f025a5.js" defer></script>
    <script src="cookie-consent.js" defer></script>
    <script src="error-reporter.js" defer></script>
    <script src="js/sw-register.js"></script>
    <script src="premium-ui.js" defer></script>
</body>

</html>
