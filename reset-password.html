<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <script src="/nfc/runtime-config.js?v=1.0"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Tag Manager -->
    <script src="/js/gtm-bootstrap.js"></script>
    <!-- End Google Tag Manager -->
    <title>إعادة تعيين كلمة المرور - MC PRIME NFC</title>
    <link rel="stylesheet" href="/nfc/homepage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Cairo:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="/nfc/auth.js?v=3.5"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 50px;
        }

        .auth-card {
            background: linear-gradient(145deg, var(--surface-color), #2a3d54);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(77, 166, 255, 0.1);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            color: #fff;
            margin-bottom: 10px;
            font-family: 'Cairo', sans-serif;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary-color);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(0, 0, 0, 0.3);
        }

        .auth-btn {
            width: 100%;
            margin-top: 10px;
        }

        .auth-footer {
            margin-top: 20px;
            text-align: center;
            color: var(--text-secondary-color);
        }

        .auth-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .error-msg {
            background: rgba(255, 82, 82, 0.1);
            color: #ff5252;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .success-msg {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
    </style>
    <link rel="stylesheet" href="/nfc/cookie-consent.css">
    <link rel="stylesheet" href="/nfc/premium-ui.css">
  <link rel="icon" href="/nfc/mc-prime-nfc.png" type="image/png">
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PLL5SLNM" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Navbar (Simplified) -->
    <nav class="navbar" style="background: rgba(28, 42, 59, 1);">
        <div class="container nav-content">
            <a href="/nfc/" class="nav-logo">
                <img src="/nfc/mc-prime-nfc.png" alt="MC PRIME">
            </a>
            <a href="/nfc/login.html" class="btn btn-secondary nav-cta">تسجيل الدخول</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-lock"></i> إعادة تعيين كلمة المرور</h1>
                <p style="color: var(--text-secondary-color);">أدخل كلمة المرور الجديدة</p>
            </div>

            <div id="error-box" class="error-msg"></div>
            <div id="success-box" class="success-msg"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="password">كلمة المرور الجديدة</label>
                    <input type="password" id="password" class="form-input" required placeholder="********"
                        minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirm-password">تأكيد كلمة المرور</label>
                    <input type="password" id="confirm-password" class="form-input" required placeholder="********"
                        minlength="6">
                </div>
                <button type="submit" class="btn btn-primary auth-btn">تعيين كلمة المرور</button>
            </form>

            <div class="auth-footer">
                <a href="/nfc/login.html">العودة لتسجيل الدخول</a>
            </div>
        </div>
    </div>

    <script src="/js/reset-password-fe88dc3f70e3.js" defer></script>
    <script src="/nfc/cookie-consent.js" defer></script>
    <script src="/nfc/error-reporter.js" defer></script>
    <script src="/js/sw-register.js"></script>
    <script src="/nfc/premium-ui.js" defer></script>
</body>

</html>
