<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1626"/>
      <stop offset="50%" stop-color="#142640"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="280" cy="200" r="280" fill="#fbbf24" opacity="0.1" filter="url(#glowEffect)"/>
  <circle cx="950" cy="450" r="320" fill="#38bdf8" opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Grid Mesh -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Left Side Visual: Modern Pyramids Motif + Cairo Skyline & Smart NFC Card -->
  <g transform="translate(140, 90)">
    <!-- Geometric Tech Pyramids Outline -->
    <g opacity="0.3" stroke="url(#goldGrad)" stroke-width="2" fill="none">
      <polygon points="120,320 220,160 320,320"/>
      <line x1="220" y1="160" x2="220" y2="320"/>
      <polygon points="260,320 330,210 400,320"/>
    </g>

    <!-- Floating Egypt Enterprise Card -->
    <g transform="translate(140, 140) rotate(-8)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="260" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
      <rect x="25" y="30" width="45" height="36" rx="6" fill="url(#goldGrad)" stroke="#92400e" stroke-width="1"/>
      <path d="M190 30 Q205 45 190 60" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M200 20 Q225 45 200 70" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <text x="25" y="110" fill="#ffffff" font-family="'Cairo', sans-serif" font-weight="900" font-size="16">مصر الرقمية • MC PRIME</text>
      <text x="25" y="132" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">EGYPT ENTERPRISE EDITION</text>
    </g>

    <g filter="url(#glowEffect)">
      <circle cx="280" cy="220" r="8" fill="#fbbf24"/>
    </g>
  </g>

  <!-- Right Side: Arabic Content Typography -->
  <g transform="translate(680, 130)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="200" height="42" rx="21" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)" stroke-width="1.5"/>
    <circle cx="25" cy="21" r="6" fill="#fbbf24"/>
    <text x="45" y="27" fill="#fbbf24" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="700" font-size="16">الشركات في مصر</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">
      بطاقات NFC للشركات
    </text>
    <text x="0" y="160" fill="url(#goldGrad)" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">
      في جمهورية مصر العربية
    </text>

    <!-- Bullet Points -->
    <g transform="translate(0, 215)">
      <circle cx="12" cy="14" r="5" fill="#fbbf24"/>
      <text x="30" y="20" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="20">
        قيادة التحول الرقمي ومواكبة مصر الرقمية
      </text>

      <circle cx="12" cy="54" r="5" fill="#fbbf24"/>
      <text x="30" y="60" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="20">
        حلول ذكية لفرق المبيعات والشركات الناشئة
      </text>

      <circle cx="12" cy="94" r="5" fill="#fbbf24"/>
      <text x="30" y="100" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="20">
        شحن سريع وتخصيص كامل للهوية المؤسسية
      </text>
    </g>

    <!-- Branding Badge -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="280" height="46" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="25" y="28" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="14" font-weight="600">
        MC PRIME • EGYPT
      </text>
    </g>
  </g>
</svg>
