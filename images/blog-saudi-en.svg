<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1914"/>
      <stop offset="50%" stop-color="#0f2920"/>
      <stop offset="100%" stop-color="#050e0b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="920" cy="200" r="280" fill="#10b981" opacity="0.12" filter="url(#glowEffect)"/>
  <circle cx="250" cy="450" r="320" fill="#fbbf24" opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Grid Mesh -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Left Side: English Content Typography -->
  <g transform="translate(80, 120)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="230" height="42" rx="21" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5"/>
    <circle cx="25" cy="21" r="6" fill="#10b981"/>
    <text x="45" y="26" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">COMPANIES IN SAUDI</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      NFC Cards in Saudi Arabia
    </text>
    <text x="0" y="155" fill="url(#greenGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
      &amp; Vision 2030 Growth
    </text>

    <!-- Bullet Points -->
    <g transform="translate(0, 205)">
      <circle cx="12" cy="14" r="5" fill="#34d399"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Support Green Sustainability &amp; Paperless Vision
      </text>

      <circle cx="12" cy="54" r="5" fill="#34d399"/>
      <text x="32" y="60" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Empower Teams Across Riyadh, Jeddah &amp; Dammam
      </text>

      <circle cx="12" cy="94" r="5" fill="#34d399"/>
      <text x="32" y="100" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Central Corporate Profile &amp; vCard Directory
      </text>
    </g>

    <!-- Branding Badge -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="280" height="46" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="25" y="28" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="1">
        MC PRIME • SAUDI ARABIA
      </text>
    </g>
  </g>

  <!-- Right Side Visual: Saudi Modern Architecture Silhouette & Smart Card -->
  <g transform="translate(680, 80)">
    <!-- Tower Silhouette (Kingdom Tower Motif) -->
    <g opacity="0.25" fill="#10b981">
      <polygon points="180,380 210,120 220,120 250,380"/>
      <circle cx="215" cy="180" r="14" fill="#0a1914"/>
      <rect x="70" y="240" width="70" height="140" rx="4"/>
      <rect x="280" y="200" width="80" height="180" rx="4"/>
    </g>

    <!-- Floating Saudi Enterprise Card -->
    <g transform="translate(140, 140) rotate(-6)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="260" height="160" rx="16" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
      <rect x="25" y="30" width="45" height="36" rx="6" fill="url(#goldGrad)" stroke="#92400e" stroke-width="1"/>
      <path d="M190 30 Q205 45 190 60" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M200 20 Q225 45 200 70" stroke="#10b981" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <text x="25" y="110" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15">SAUDI VISION 2030</text>
      <text x="25" y="132" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">ENTERPRISE EDITION</text>
    </g>

    <g filter="url(#glowEffect)">
      <circle cx="280" cy="220" r="8" fill="#10b981"/>
    </g>
  </g>
</svg>
