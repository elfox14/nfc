<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#080b10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca85"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2534"/>
      <stop offset="100%" stop-color="#0f1622"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="1050" cy="80" r="220" fill="#c5a059" opacity="0.05"/>
  <circle cx="120" cy="560" r="180" fill="#c5a059" opacity="0.05"/>

  <!-- NFC card left -->
  <g transform="translate(180, 190)">
    <rect x="0" y="0" width="300" height="190" rx="18" fill="url(#cardGrad)" stroke="#c5a059" stroke-width="2.5"/>
    <rect x="24" y="28" width="56" height="44" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <path d="M24 50 h56 M38 28 v44 M66 28 v44" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M250 130 q18 0 18 -18 M250 148 q36 0 36 -36 M250 166 q54 0 54 -54" fill="none" stroke="#e6ca85" stroke-width="5" stroke-linecap="round"/>
    <circle cx="250" cy="112" r="7" fill="#e6ca85"/>
    <text x="24" y="130" font-family="Arial" font-size="30" font-weight="bold" fill="#e6ca85">NFC</text>
    <text x="24" y="162" font-family="Arial" font-size="16" fill="#8b949e">Touch &amp; Share</text>
  </g>

  <!-- VS badge -->
  <g transform="translate(600, 285)">
    <circle r="62" fill="url(#goldGrad)"/>
    <text y="18" text-anchor="middle" font-family="Arial" font-size="52" font-weight="900" fill="#0d1117">VS</text>
  </g>

  <!-- QR right -->
  <g transform="translate(740, 190)">
    <rect x="0" y="0" width="190" height="190" rx="14" fill="#ffffff"/>
    <g fill="#0d1117">
      <rect x="18" y="18" width="52" height="52"/><rect x="120" y="18" width="52" height="52"/><rect x="18" y="120" width="52" height="52"/>
      <rect x="28" y="28" width="32" height="32" fill="#ffffff"/><rect x="130" y="28" width="32" height="32" fill="#ffffff"/><rect x="28" y="130" width="32" height="32" fill="#ffffff"/>
      <rect x="84" y="18" width="22" height="22"/><rect x="18" y="84" width="22" height="22"/><rect x="84" y="84" width="40" height="40"/>
      <rect x="134" y="84" width="22" height="22"/><rect x="84" y="134" width="22" height="22"/><rect x="134" y="134" width="38" height="38"/>
      <rect x="120" y="120" width="10" height="10"/><rect x="108" y="60" width="10" height="10"/><rect x="60" y="108" width="10" height="10"/>
    </g>
    <text x="95" y="228" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#e6ca85">QR Code</text>
    <text x="95" y="258" text-anchor="middle" font-family="Arial" font-size="16" fill="#8b949e">Scan &amp; Open</text>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#ffffff">NFC vs QR Code — Which One Wins in 2026?</text>
</svg>
