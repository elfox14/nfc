<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="50%" stop-color="#15243b"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="920" cy="200" r="280" fill="#a855f7" opacity="0.1" filter="url(#glowEffect)"/>
  <circle cx="250" cy="450" r="320" fill="#3b82f6" opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Grid Mesh -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Left Side: English Content Typography -->
  <g transform="translate(80, 120)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="200" height="42" rx="21" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1.5"/>
    <circle cx="25" cy="21" r="6" fill="#c084fc"/>
    <text x="45" y="26" fill="#c084fc" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">FOR FREELANCERS</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      Freelancer's Guide:
    </text>
    <text x="0" y="155" fill="url(#purpleGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
      Winning High-Ticket Clients
    </text>

    <!-- Bullet Points -->
    <g transform="translate(0, 205)">
      <circle cx="12" cy="14" r="5" fill="#c084fc"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Instant One-Tap Portfolio &amp; Case Study Sharing
      </text>

      <circle cx="12" cy="54" r="5" fill="#c084fc"/>
      <text x="32" y="60" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Direct Calendly Booking &amp; Client Inquiries
      </text>

      <circle cx="12" cy="94" r="5" fill="#c084fc"/>
      <text x="32" y="100" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Elite First Impressions with Premium NFC Cards
      </text>
    </g>

    <!-- Branding Badge -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="280" height="46" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="25" y="28" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="1">
        MC PRIME • FREELANCERS
      </text>
    </g>
  </g>

  <!-- Right Side Visual: Designer / Freelancer Workspace & Portfolio Tap -->
  <g transform="translate(680, 90)">
    <!-- Laptop Mockup -->
    <g filter="url(#dropShadow)">
      <rect x="80" y="100" width="300" height="190" rx="14" fill="url(#laptopGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <rect x="95" y="115" width="270" height="160" rx="8" fill="#090d16"/>
      <rect x="110" y="130" width="75" height="50" rx="6" fill="#1e293b"/>
      <rect x="195" y="130" width="75" height="50" rx="6" fill="#1e293b"/>
      <rect x="280" y="130" width="70" height="50" rx="6" fill="#1e293b"/>
      <rect x="110" y="190" width="75" height="50" rx="6" fill="#1e293b"/>
      <rect x="195" y="190" width="75" height="50" rx="6" fill="url(#purpleGrad)" opacity="0.8"/>
      <rect x="280" y="190" width="70" height="50" rx="6" fill="#1e293b"/>
      <circle cx="232" cy="215" r="12" fill="#ffffff"/>
      <polygon points="40,290 420,290 380,310 80,310" fill="#334155"/>
      <rect x="200" y="290" width="60" height="6" rx="3" fill="#64748b"/>
    </g>

    <!-- Floating Freelancer NFC Card -->
    <g transform="translate(160, 230) rotate(-10)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="240" height="145" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <circle cx="45" cy="45" r="20" fill="rgba(255,255,255,0.25)"/>
      <text x="37" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16">⚡</text>
      <!-- NFC Waves -->
      <path d="M180 30 Q195 45 180 60" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M190 20 Q215 45 190 70" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <!-- Card Text -->
      <text x="25" y="100" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15">SMART CREATIVE CARD</text>
      <text x="25" y="122" fill="#c7d2fe" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="10">BEHANCE • GITHUB • LINKEDIN</text>
    </g>

    <!-- Glowing Signal -->
    <g filter="url(#glowEffect)">
      <circle cx="320" cy="270" r="10" fill="#a855f7"/>
      <circle cx="320" cy="270" r="5" fill="#ffffff"/>
    </g>
  </g>
</svg>
