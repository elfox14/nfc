<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="50%" stop-color="#11233d"/>
      <stop offset="100%" stop-color="#060d17"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="corpCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="920" cy="200" r="280" fill="#2563eb" opacity="0.12" filter="url(#glowEffect)"/>
  <circle cx="250" cy="450" r="320" fill="#38bdf8" opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Grid Mesh -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Left Side: English Content Typography -->
  <g transform="translate(80, 120)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="rgba(56,189,248,0.15)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
    <circle cx="25" cy="21" r="6" fill="#38bdf8"/>
    <text x="45" y="26" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">FOR ENTERPRISE</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      Smart NFC Cards for
    </text>
    <text x="0" y="155" fill="url(#blueGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
      Corporate &amp; Sales Teams
    </text>

    <!-- Bullet Points -->
    <g transform="translate(0, 205)">
      <circle cx="12" cy="14" r="5" fill="#38bdf8"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Unified Brand Identity Across All Employees
      </text>

      <circle cx="12" cy="54" r="5" fill="#38bdf8"/>
      <text x="32" y="60" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Centralized Admin Dashboard for Card Updates
      </text>

      <circle cx="12" cy="94" r="5" fill="#38bdf8"/>
      <text x="32" y="100" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Boost B2B Sales Pipeline &amp; Conversion Velocity
      </text>
    </g>

    <!-- Branding Badge -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="280" height="46" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="25" y="28" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="1">
        MC PRIME • ENTERPRISE
      </text>
    </g>
  </g>

  <!-- Right Side Visual: Corporate Tower Silhouette & Stacked Enterprise Cards -->
  <g transform="translate(680, 80)">
    <!-- Buildings / Architecture Skyline Silhouette -->
    <g opacity="0.25" fill="#38bdf8">
      <rect x="50" y="160" width="60" height="260" rx="4"/>
      <rect x="120" y="110" width="80" height="310" rx="4"/>
      <rect x="210" y="70" width="90" height="350" rx="4"/>
      <rect x="310" y="140" width="70" height="280" rx="4"/>
      <line x1="255" y1="30" x2="255" y2="70" stroke="#38bdf8" stroke-width="3"/>
    </g>

    <!-- Stacked Employee NFC Cards -->
    <!-- Card 3 (Back) -->
    <g transform="translate(120, 220) rotate(-15)" filter="url(#dropShadow)" opacity="0.6">
      <rect x="0" y="0" width="220" height="135" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    </g>
    <!-- Card 2 (Middle) -->
    <g transform="translate(140, 180) rotate(-6)" filter="url(#dropShadow)" opacity="0.8">
      <rect x="0" y="0" width="230" height="140" rx="14" fill="#0f172a" stroke="rgba(77,166,255,0.3)" stroke-width="1.5"/>
    </g>
    <!-- Card 1 (Front - Primary Enterprise Card) -->
    <g transform="translate(160, 140) rotate(6)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="250" height="155" rx="16" fill="url(#corpCardGrad)" stroke="rgba(77,166,255,0.6)" stroke-width="2"/>
      <rect x="25" y="30" width="40" height="32" rx="6" fill="#38bdf8" opacity="0.9"/>
      <path d="M185 30 Q200 45 185 60" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M195 20 Q220 45 195 70" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      <text x="25" y="105" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16">SMART TEAM PASS</text>
      <text x="25" y="128" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">ENTERPRISE SOLUTION</text>
    </g>
  </g>
</svg>
