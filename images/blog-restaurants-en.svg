<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#1b2438"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3b53"/>
      <stop offset="100%" stop-color="#161f2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ee5253"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="920" cy="200" r="280" fill="#ff9f43" opacity="0.1" filter="url(#glowEffect)"/>
  <circle cx="250" cy="450" r="320" fill="#00d2ff" opacity="0.08" filter="url(#glowEffect)"/>

  <!-- Grid Mesh -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Left Side: English Content Typography -->
  <g transform="translate(80, 120)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(255,159,67,0.15)" stroke="rgba(255,159,67,0.4)" stroke-width="1.5"/>
    <circle cx="25" cy="21" r="6" fill="#ff9f43"/>
    <text x="45" y="26" fill="#ff9f43" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" letter-spacing="0.5">RESTAURANTS &amp; CAFES</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
      Digital Menus for
    </text>
    <text x="0" y="155" fill="url(#accentGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
      Modern Restaurants
    </text>

    <!-- Bullet Points -->
    <g transform="translate(0, 205)">
      <circle cx="12" cy="14" r="5" fill="#ff9f43"/>
      <text x="32" y="20" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Eliminate 100% of Printing &amp; Reprint Costs
      </text>

      <circle cx="12" cy="54" r="5" fill="#ff9f43"/>
      <text x="32" y="60" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Boost Ticket Sizes via Visual Dish Upselling
      </text>

      <circle cx="12" cy="94" r="5" fill="#ff9f43"/>
      <text x="32" y="100" fill="#cbd5e1" font-family="'Inter', sans-serif" font-weight="500" font-size="19">
        Faster Table Turns &amp; Seamless Guest Orders
      </text>
    </g>

    <!-- Branding Badge -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="280" height="46" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="25" y="28" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="1">
        MC PRIME • RESTAURANTS
      </text>
    </g>
  </g>

  <!-- Right Side Visual: Table Stand & QR / NFC Menu -->
  <g transform="translate(680, 70)">
    <!-- Base Table Reflection -->
    <ellipse cx="230" cy="480" rx="200" ry="25" fill="#000000" opacity="0.5"/>

    <!-- Acrylic Table Stand -->
    <g filter="url(#dropShadow)">
      <!-- Stand Base -->
      <polygon points="120,440 340,440 310,470 150,470" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <!-- Stand Body -->
      <rect x="130" y="60" width="200" height="380" rx="16" fill="url(#standGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <!-- Header Band with Dining Icon -->
      <rect x="130" y="60" width="200" height="70" rx="16" fill="url(#accentGrad)"/>
      <circle cx="230" cy="95" r="22" fill="rgba(255,255,255,0.2)"/>
      <path d="M220 90 L220 105 M225 90 L225 105 M235 90 L235 105 M240 90 L240 105" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <circle cx="230" cy="95" r="8" fill="#ffffff"/>

      <!-- QR Code Mockup in Stand -->
      <rect x="165" y="160" width="130" height="130" rx="10" fill="#ffffff"/>
      <!-- QR Blocks -->
      <rect x="175" y="170" width="32" height="32" rx="4" fill="#0f172a"/>
      <rect x="181" y="176" width="20" height="20" rx="2" fill="#ffffff"/>
      <rect x="186" y="181" width="10" height="10" fill="#0f172a"/>
      <rect x="253" y="170" width="32" height="32" rx="4" fill="#0f172a"/>
      <rect x="259" y="176" width="20" height="20" rx="2" fill="#ffffff"/>
      <rect x="264" y="181" width="10" height="10" fill="#0f172a"/>
      <rect x="175" y="248" width="32" height="32" rx="4" fill="#0f172a"/>
      <rect x="181" y="254" width="20" height="20" rx="2" fill="#ffffff"/>
      <rect x="186" y="259" width="10" height="10" fill="#0f172a"/>
      <!-- Decorative QR Dots -->
      <circle cx="230" cy="225" r="6" fill="#00d2ff"/>
      <circle cx="245" cy="245" r="4" fill="#0f172a"/>
      <circle cx="225" cy="255" r="5" fill="#0f172a"/>
      <circle cx="255" cy="220" r="4" fill="#0f172a"/>

      <!-- NFC Contactless Symbol & Text -->
      <g transform="translate(195, 310)">
        <circle cx="35" cy="25" r="22" fill="rgba(0,210,255,0.15)" stroke="rgba(0,210,255,0.5)" stroke-width="1.5"/>
        <path d="M30 17 Q40 25 30 33" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M35 12 Q50 25 35 38" stroke="#00d2ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <text x="230" y="375" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" text-anchor="middle">TAP OR SCAN FOR MENU</text>
      <text x="230" y="405" fill="#ff9f43" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" text-anchor="middle">MC PRIME DINING</text>
    </g>

    <!-- Floating 5-Star Rating Badge -->
    <g transform="translate(40, 200)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="140" height="50" rx="14" fill="#1e293b" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="18" y="32" fill="#fbbf24" font-size="18">★★★★★</text>
    </g>
  </g>
</svg>
