<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1322"/>
      <stop offset="50%" stop-color="#0f2038"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a75d3"/>
      <stop offset="50%" stop-color="#144d9b"/>
      <stop offset="100%" stop-color="#092754"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="250" cy="180" r="280" fill="#0066ff" opacity="0.12" filter="url(#glowEffect)"/>
  <circle cx="950" cy="450" r="320" fill="#00d2ff" opacity="0.08" filter="url(#glowEffect)"/>
  <circle cx="600" cy="100" r="150" fill="#7928ca" opacity="0.1" filter="url(#glowEffect)"/>

  <!-- Modern Grid Mesh Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
  </g>

  <!-- Right Side Visual / Illustration (Event & Phone Tap) -->
  <g transform="translate(180, 80)">
    <!-- Smartphone Mockup -->
    <g filter="url(#dropShadow)">
      <rect x="70" y="40" width="220" height="420" rx="36" fill="url(#phoneGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>
      <!-- Screen -->
      <rect x="85" y="60" width="190" height="380" rx="24" fill="#0c1524"/>
      <!-- Phone Speaker Notch -->
      <rect x="145" y="48" width="70" height="6" rx="3" fill="#334155"/>
      <!-- Screen Contact Card UI -->
      <circle cx="180" cy="130" r="36" fill="url(#glowGrad)"/>
      <circle cx="180" cy="120" r="14" fill="#ffffff"/>
      <path d="M162 148 Q180 134 198 148" fill="#ffffff"/>
      <rect x="115" y="180" width="130" height="12" rx="6" fill="#ffffff"/>
      <rect x="135" y="200" width="90" height="8" rx="4" fill="#64748b"/>
      <!-- Contact Details Pill Buttons -->
      <rect x="105" y="230" width="150" height="30" rx="10" fill="#1e293b" stroke="rgba(77,166,255,0.3)" stroke-width="1"/>
      <rect x="120" y="242" width="60" height="6" rx="3" fill="#38bdf8"/>
      <rect x="105" y="270" width="150" height="30" rx="10" fill="#1e293b" stroke="rgba(77,166,255,0.3)" stroke-width="1"/>
      <rect x="120" y="282" width="75" height="6" rx="3" fill="#38bdf8"/>
      <!-- Big Save Contact Button -->
      <rect x="105" y="320" width="150" height="38" rx="12" fill="url(#glowGrad)"/>
      <rect x="135" y="336" width="90" height="6" rx="3" fill="#ffffff"/>
    </g>

    <!-- Floating NFC Smart Card (Tapping Phone) -->
    <g transform="translate(180, 160) rotate(-15)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="260" height="160" rx="18" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
      <!-- Chip -->
      <rect x="30" y="35" width="45" height="36" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
      <line x1="30" y1="53" x2="75" y2="53" stroke="#d97706" stroke-width="1.5"/>
      <line x1="52" y1="35" x2="52" y2="71" stroke="#d97706" stroke-width="1.5"/>
      <!-- NFC Waves on Card -->
      <path d="M190 35 Q205 50 190 65" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M200 25 Q225 50 200 75" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
      <path d="M210 15 Q245 50 210 85" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
      <!-- Logo & Card Text -->
      <text x="30" y="115" fill="#ffffff" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="900" font-size="18" letter-spacing="2">MC PRIME</text>
      <text x="30" y="135" fill="#93c5fd" font-family="'Segoe UI', Tahoma, sans-serif" font-weight="600" font-size="11">SMART EVENT PASS</text>
    </g>

    <!-- Glowing Contactless Transmission Wave -->
    <g filter="url(#glowEffect)">
      <path d="M220 220 Q280 200 240 280" stroke="#00d2ff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
      <circle cx="250" cy="235" r="8" fill="#ffffff"/>
      <circle cx="270" cy="260" r="5" fill="#00d2ff"/>
    </g>
  </g>

  <!-- Left Side: Arabic Typography & Event Badge -->
  <g transform="translate(680, 130)">
    <!-- Event Category Pill -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(77,166,255,0.15)" stroke="rgba(77,166,255,0.4)" stroke-width="1.5"/>
    <circle cx="30" cy="21" r="6" fill="#00d2ff"/>
    <text x="50" y="27" fill="#38bdf8" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="700" font-size="16">تسويق وفعاليات</text>

    <!-- Main Title -->
    <text x="0" y="100" fill="#ffffff" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5">
      بطاقات NFC في
    </text>
    <text x="0" y="160" fill="url(#glowGrad)" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="900" font-size="46" letter-spacing="-0.5">
      المعارض والمؤتمرات
    </text>

    <!-- Subtitle Bullet Points -->
    <g transform="translate(0, 210)">
      <circle cx="12" cy="14" r="5" fill="#38bdf8"/>
      <text x="30" y="20" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="20">
        حفظ بيانات العملاء بلمسة واحدة vCard
      </text>

      <circle cx="12" cy="54" r="5" fill="#38bdf8"/>
      <text x="30" y="60" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="20">
        أتمتة المبيعات والربط مع أنظمة CRM
      </text>

      <circle cx="12" cy="94" r="5" fill="#38bdf8"/>
      <text x="30" y="100" fill="#cbd5e1" font-family="'Cairo', 'Tajawal', sans-serif" font-weight="600" font-size="20">
        مضاعفة صفقات المعرض ومعدل التحويل
      </text>
    </g>

    <!-- Branding Footer Badge -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="280" height="46" rx="12" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="25" y="28" fill="#94a3b8" font-family="'Segoe UI', Tahoma, sans-serif" font-size="14" font-weight="600">
        MC PRIME • KNOWLEDGE HUB
      </text>
    </g>
  </g>
</svg>
