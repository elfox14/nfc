name: FTP Certificate Probe

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/ftp-certificate-probe.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read public FTPS certificate identity
        env:
          FTP_SERVER_IP: 146.19.133.5
        run: |
          certificate="$(mktemp)"
          timeout 30 openssl s_client \
            -starttls ftp \
            -connect "${FTP_SERVER_IP}:21" \
            -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/{capture=1} capture{print} /END CERTIFICATE/{exit}' \
            > "${certificate}"
          test -s "${certificate}"
          openssl x509 -in "${certificate}" -noout -subject -issuer -ext subjectAltName
