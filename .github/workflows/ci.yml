name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Verify generated assets
      run: npm run check:assets

    - name: Lint server and tests
      run: npm run lint

    - name: Run Jest tests
      id: jest
      continue-on-error: true
      run: npm test -- --json --outputFile=jest-results.json

    - name: Upload Jest report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jest-results-node-${{ matrix.node-version }}
        path: jest-results.json
        if-no-files-found: warn
        retention-days: 7

    - name: Enforce Jest result
      if: steps.jest.outcome == 'failure'
      run: exit 1

    - name: Security audit
      run: npm run audit:prod

  e2e:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/mcnfc_e2e
      MONGO_DB: mcnfc_e2e
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      JWT_SECRET: ci-e2e-jwt-secret-at-least-thirty-two-characters
      TOKEN_HASH_SECRET: ci-e2e-hash-secret-at-least-thirty-two-characters
      GOOGLE_CLIENT_ID: ci-e2e-google-client-id
      GOOGLE_CLIENT_SECRET: ci-e2e-google-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn
          retention-days: 7
