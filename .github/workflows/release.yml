name: Release and Rollback

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref, tag, or full commit SHA to deploy
        required: true
        default: main
      release_tag:
        description: New release tag (leave empty for rollback/redeploy)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/mcnfc_release
      MONGO_DB: mcnfc_release
      JWT_SECRET: release-test-jwt-secret-which-is-longer-than-32-characters
      TOKEN_HASH_SECRET: release-test-hash-secret-which-is-different-and-long
      GOOGLE_CLIENT_ID: release-test-client-id
      PUBLIC_BASE_URL: http://127.0.0.1:3000/nfc
      SITE_BASE_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      EMAIL_PROVIDER: console
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Resolve immutable release commit
        id: release_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "${RELEASE_TAG}" = "${expected_tag}"
          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Tag ${RELEASE_TAG} already exists. Tags are immutable." >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run check:assets
      - run: npm run audit:prod
      - run: npm test -- --runInBand
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package immutable static release
        env:
          RELEASE_SHA: ${{ steps.release_ref.outputs.sha }}
        run: npm run package:static

      - name: Upload immutable static release artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-static-${{ steps.release_ref.outputs.sha }}
          path: dist/static/nfc
          retention-days: 90

      - name: Validate production deployment secrets
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
          STATIC_FTP_URL: ${{ secrets.STATIC_FTP_URL }}
          STATIC_FTP_USERNAME: ${{ secrets.STATIC_FTP_USERNAME }}
          STATIC_FTP_PASSWORD: ${{ secrets.STATIC_FTP_PASSWORD }}
          STATIC_REMOTE_DIR: ${{ vars.STATIC_REMOTE_DIR }}
        run: |
          : "${RENDER_DEPLOY_HOOK_URL:?Missing RENDER_DEPLOY_HOOK_URL}"
          : "${API_HEALTH_URL:?Missing API_HEALTH_URL}"
          : "${STATIC_FTP_URL:?Missing STATIC_FTP_URL}"
          : "${STATIC_FTP_USERNAME:?Missing STATIC_FTP_USERNAME}"
          : "${STATIC_FTP_PASSWORD:?Missing STATIC_FTP_PASSWORD}"
          case "${STATIC_REMOTE_DIR:-/nfc}" in ""|"/") exit 1 ;; esac

      - name: Deploy API commit to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOY_SHA: ${{ steps.release_ref.outputs.sha }}
        run: curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK_URL}&ref=${DEPLOY_SHA}"

      - name: Wait for API readiness
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
          DEPLOY_SHA: ${{ steps.release_ref.outputs.sha }}
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${API_HEALTH_URL}" | EXPECTED_SHA="${DEPLOY_SHA}" node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const health=JSON.parse(body);process.exit(health.status==='ok'&&health.release===process.env.EXPECTED_SHA?0:1)})"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Deploy matching static package
        env:
          STATIC_FTP_URL: ${{ secrets.STATIC_FTP_URL }}
          STATIC_FTP_USERNAME: ${{ secrets.STATIC_FTP_USERNAME }}
          STATIC_FTP_PASSWORD: ${{ secrets.STATIC_FTP_PASSWORD }}
          STATIC_REMOTE_DIR: ${{ vars.STATIC_REMOTE_DIR }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          remote_dir="${STATIC_REMOTE_DIR:-/nfc}"
          lftp -u "${STATIC_FTP_USERNAME},${STATIC_FTP_PASSWORD}" "${STATIC_FTP_URL}" -e "set ftp:ssl-force true; set ssl:verify-certificate true; mirror --reverse --delete --verbose dist/static/nfc ${remote_dir}; bye"

      - name: Verify matching static release
        env:
          STATIC_RELEASE_URL: ${{ vars.STATIC_RELEASE_URL || 'https://mcprim.com/nfc/release.json' }}
          DEPLOY_SHA: ${{ steps.release_ref.outputs.sha }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --header 'Cache-Control: no-cache' "${STATIC_RELEASE_URL}?sha=${DEPLOY_SHA}" | EXPECTED_SHA="${DEPLOY_SHA}" node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{const release=JSON.parse(body);process.exit(release.sha===process.env.EXPECTED_SHA?0:1)})"; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Create immutable GitHub release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.release_ref.outputs.sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git tag --annotate "${RELEASE_TAG}" "${DEPLOY_SHA}" --message "MC PRIME NFC ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"
          gh release create "${RELEASE_TAG}" --verify-tag --generate-notes --title "MC PRIME NFC ${RELEASE_TAG}"
