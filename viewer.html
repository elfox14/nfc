<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <script src="runtime-config.js?v=1.0"></script>
    <!-- Google Tag Manager -->
    <script src="js/gtm-bootstrap.js"></script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap"></noscript>
    <title>عرض البطاقة الرقمية الفاخرة | MC PRIME NFC</title>
    <meta name="description" content="اعرض بطاقة العمل الذكية NFC واحفظ جهة الاتصال مباشرة على هاتفك. شارك بياناتك بسهولة مع MC PRIME.">
    <meta name="keywords" content="بطاقة عمل رقمية, NFC, QR Code, MC PRIME, عرض البطاقة, جهة اتصال">
    <meta name="robots" content="index, follow">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="عرض البطاقة الرقمية | MC PRIME">
    <meta property="og:description" content="اعرض بطاقة العمل الذكية NFC واحفظ جهة الاتصال مباشرة على هاتفك.">
    <meta property="og:image" content="https://www.mcprim.com/nfc/mcprime-social-1200x630.png">
    <meta property="og:site_name" content="MC PRIME">

    <!-- Favicon & PWA -->
    <link rel="icon" id="favicon" href="mc-prime-nfc.png" type="image/png">
    <link rel="apple-touch-icon" href="mc-prime-nfc.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060913">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="viewer.css?v=4.0">
    <link rel="stylesheet" href="cookie-consent.css">
    <link rel="stylesheet" href="premium-ui.css">
    <script src="lang-switcher.js" defer></script>

    <meta name="color-scheme" content="dark light">
    <link rel="canonical" href="https://www.mcprim.com/nfc/viewer.html" id="canonical-link" />

    <link rel="alternate" hreflang="ar" href="https://www.mcprim.com/nfc/viewer.html" />
    <link rel="alternate" hreflang="en" href="https://www.mcprim.com/nfc/viewer-en.html" />
    <link rel="alternate" hreflang="x-default" href="https://www.mcprim.com/nfc/viewer.html" />

    <!-- Schema.org Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "mainEntity": {
        "@type": "Person",
        "name": "MC PRIME Digital Card",
        "description": "Smart NFC Business Card Hosted on MC PRIME"
      }
    }
    </script>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PLL5SLNM" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Ambient Aurora Mesh Orbs -->
    <div class="ambient-aurora-container">
        <div class="aurora-orb aurora-gold"></div>
        <div class="aurora-orb aurora-blue"></div>
    </div>

    <!-- Top Progress Bar -->
    <div id="page-progress-bar"></div>

    <!-- Top Navigation Bar -->
    <header class="viewer-top-bar" aria-label="شريط التحكم">
        <a href="index.html" class="top-bar-brand" title="العودة إلى الرئيسية">
            <img src="mc-prime-nfc.png" alt="MC PRIME">
            <span>MC PRIME</span>
        </a>
        <div class="top-bar-actions">
            <a href="viewer-en.html" class="top-icon-btn lang-btn" aria-label="Switch to English">
                <i class="fas fa-globe"></i>
                <span>EN</span>
            </a>
            <div class="theme-switch-wrapper" style="display:none;">
                <input type="checkbox" id="theme-toggle" checked />
            </div>
            <a href="editor.html" class="top-cta-btn">اصنع بطاقتك</a>
        </div>
    </header>

    <!-- Skeleton Loader -->
    <div id="loader" class="viewer-loader">
        <div class="skeleton-loader-wrapper">
            <div class="skeleton-card-shape">
                <div class="skeleton-shimmer"></div>
                <div class="skeleton-card-inner">
                    <div class="skeleton-circle"></div>
                    <div class="skeleton-line skeleton-line-lg"></div>
                    <div class="skeleton-line skeleton-line-sm"></div>
                </div>
            </div>
            <p class="skeleton-text">جاري إعداد العرض الفاخر للبطاقة...</p>
            <div class="skeleton-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Main Showcase Container -->
    <div class="viewer-container" style="display: none;">

        <!-- Executive Persona Header -->
        <section class="executive-hero-header" id="profile-header" aria-label="الملف الشخصي">
            <div class="hero-avatar-container">
                <div class="hero-avatar-ring">
                    <div id="profile-image-container" class="hero-avatar-img"></div>
                </div>
                <span class="verified-badge-pill" title="حساب موثق">
                    <i class="fas fa-check-circle"></i>
                    <span>موثّق</span>
                </span>
            </div>
            <h1 id="profile-name" class="hero-display-name"></h1>
            <p id="profile-tagline" class="hero-display-tagline"></p>
            <div class="hero-status-row">
                <div class="availability-badge">
                    <span class="pulse-dot"></span>
                    <span>متاح للأعمال والاستشارات</span>
                </div>
            </div>
        </section>

        <!-- 3D Centerpiece Showcase Stage -->
        <div class="cards-container">
            <div class="card-stage" id="card-stage">
                <!-- Reflection Shadow Pedestal -->
                <div class="card-pedestal-shadow" id="card-shadow-reflect"></div>

                <!-- Dual-Sided 3D Card -->
                <div class="cards-wrapper-viewer" id="cards-wrapper-viewer" title="انقر لتقليب البطاقة">
                    <div class="business-card-viewer" id="card-front-display">
                        <div class="card-hologram-sheen"></div>
                        <div class="nfc-chip-indicator">
                            <i class="fas fa-wifi"></i>
                            <span>NFC SMART CARD</span>
                        </div>
                    </div>
                    <div class="business-card-viewer" id="card-back-display">
                        <div class="card-hologram-sheen"></div>
                    </div>
                </div>
            </div>

            <!-- Showcase Floating Controls Under Card -->
            <div class="showcase-controls-dock">
                <button class="stage-pill-btn" id="viewer-flip-btn" aria-label="تقليب البطاقة">
                    <i class="fas fa-sync-alt"></i>
                    <span>تقليب 3D</span>
                </button>
                <button class="stage-pill-btn" id="save-front-png-btn" aria-label="حفظ الواجهة">
                    <i class="fas fa-image"></i>
                    <span>الواجهة (PNG)</span>
                </button>
                <button class="stage-pill-btn" id="save-back-png-btn" aria-label="حفظ الخلفية">
                    <i class="fas fa-image"></i>
                    <span>الخلفية (PNG)</span>
                </button>
                <button class="stage-pill-btn" id="save-pdf-btn" aria-label="حفظ PDF">
                    <i class="fas fa-file-pdf"></i>
                    <span>حفظ PDF</span>
                </button>
            </div>
        </div>

        <!-- Minimalist Luxury Action Hub (Pop-out Sheet Triggers) -->
        <nav class="luxury-action-hub" aria-label="أزرار الوصول السريع">
            <!-- Tile 1: Direct Contact Sheet Trigger -->
            <button class="action-tile-btn" id="open-contact-sheet-btn" data-sheet-target="sheet-contact" aria-label="وسائل الاتصال المباشرة">
                <div class="tile-icon-box tile-blue">
                    <i class="fas fa-phone-alt"></i>
                </div>
                <div class="tile-info">
                    <span class="tile-title">الاتصال والتواصل</span>
                    <span class="tile-sub">قنوات الاتصال المباشرة</span>
                </div>
                <i class="fas fa-chevron-left tile-arrow"></i>
            </button>

            <!-- Tile 2: QR Code Modal -->
            <button class="action-tile-btn" id="show-qr-btn" aria-label="رمز QR الذكي">
                <div class="tile-icon-box tile-gold">
                    <i class="fas fa-qrcode"></i>
                </div>
                <div class="tile-info">
                    <span class="tile-title">رمز QR الذكي</span>
                    <span class="tile-sub">امسح الرمز بهاتفك</span>
                </div>
                <i class="fas fa-chevron-left tile-arrow"></i>
            </button>

            <!-- Tile 3: Story Creator -->
            <button class="action-tile-btn" id="add-to-story-btn" aria-label="مشاركة في الستوري">
                <div class="tile-icon-box tile-pink">
                    <i class="fab fa-instagram"></i>
                </div>
                <div class="tile-info">
                    <span class="tile-title">مشاركة في الستوري</span>
                    <span class="tile-sub">تجهيز قصة انستجرام وسناب</span>
                </div>
                <i class="fas fa-chevron-left tile-arrow"></i>
            </button>

            <!-- Tile 4: Copy Link -->
            <button class="action-tile-btn" id="copy-link-btn" aria-label="نسخ رابط البطاقة">
                <div class="tile-icon-box tile-purple">
                    <i class="fas fa-link"></i>
                </div>
                <div class="tile-info">
                    <span class="tile-title">نسخ الرابط</span>
                    <span class="tile-sub">رابط المشاركة السريعة</span>
                </div>
                <i class="fas fa-chevron-left tile-arrow"></i>
            </button>

            <!-- Tile 5: Email Signature -->
            <button class="action-tile-btn" id="save-email-sig-btn" aria-label="توقيع الإيميل">
                <div class="tile-icon-box tile-emerald">
                    <i class="fas fa-signature"></i>
                </div>
                <div class="tile-info">
                    <span class="tile-title">توقيع الإيميل</span>
                    <span class="tile-sub">نسخ توقيع احترافي للبريد</span>
                </div>
                <i class="fas fa-chevron-left tile-arrow"></i>
            </button>
        </nav>

        <!-- Pop-out Sheet: Direct Contact Sheet -->
        <div class="luxury-sheet-backdrop" id="sheet-contact" aria-hidden="true">
            <div class="luxury-sheet" role="dialog" aria-labelledby="sheet-contact-title">
                <div class="sheet-handle"></div>
                <div class="sheet-header">
                    <div class="sheet-title-group">
                        <i class="fas fa-phone-alt" style="color:#60a5fa;"></i>
                        <h3 id="sheet-contact-title">معلومات ووسائل الاتصال</h3>
                    </div>
                    <button class="sheet-close-btn" id="sheet-contact-close-btn" aria-label="إغلاق">&times;</button>
                </div>

                <!-- Container where viewer.js injects contact links -->
                <div id="contact-links-container"></div>
            </div>
        </div>

        <!-- Floating Apple Capsule Dock -->
        <footer class="sticky-footer" aria-label="إجراءات الحفظ والمشاركة">
            <button class="footer-primary-btn" id="save-vcf-btn" aria-label="حفظ كجهة اتصال">
                <i class="fas fa-user-plus"></i>
                <span>حفظ كجهة اتصال (VCF)</span>
            </button>

            <button class="footer-icon-btn" id="web-share-btn" aria-label="مشاركة البطاقة">
                <i class="fas fa-share-alt"></i>
            </button>
        </footer>

    </div><!-- /viewer-container -->

    <!-- QR Modal -->
    <div class="qr-modal-overlay" id="qr-modal-overlay">
        <div class="qr-modal">
            <div class="qr-modal-title">
                <i class="fas fa-qrcode"></i>
                <span>رمز QR الذكي</span>
            </div>
            <p class="qr-modal-subtitle">صوِّب كاميرا الهاتف نحو الرمز لعرض هذه البطاقة فوراً</p>
            <div class="qr-modal-image-wrapper" id="qr-modal-image-wrapper">
                <div class="qr-spinner" id="qr-spinner"></div>
            </div>
            <button class="qr-modal-close" id="qr-modal-close">
                <i class="fas fa-times"></i> إغلاق
            </button>
        </div>
    </div>

    <!-- Toast Feedback Container -->
    <div id="toast-container" role="status" aria-live="polite"></div>

    <!-- Hidden Rendering Containers for Canvas Image Capture -->
    <div class="visually-hidden">
        <div class="business-card-render-wrapper" id="front-card"></div>
        <div class="business-card-render-wrapper" id="back-card"></div>
    </div>

    <!-- Demo Card Fallback: If viewer.html is opened directly without ?id=..., provide instant preview -->
    <script>
        if (!new URLSearchParams(window.location.search).get('id')) {
            window.cardData = {
                inputs: {
                    'input-name': 'م. أحمد محمود',
                    'input-tagline': 'استشاري حلول التحول الرقمي وتطوير الأعمال',
                    'front-bg-start': '#0b1329',
                    'front-bg-end': '#1e293b',
                    'back-bg-start': '#0b1329',
                    'back-bg-end': '#1e293b',
                    'name-color': '#ffffff',
                    'tagline-color': '#c5a059',
                    'logo-size': 20
                },
                imageUrls: {
                    capturedFront: 'card-front.webp',
                    capturedBack: 'card-front.webp'
                },
                dynamic: {
                    phones: [{ value: '+20 100 123 4567' }],
                    staticSocial: {
                        email: { value: 'contact@mcprim.com' },
                        whatsapp: { value: '+201001234567' },
                        website: { value: 'https://mcprim.com' },
                        linkedin: { value: 'mcprime' }
                    }
                }
            };
        }

        // Sheet open/close bindings
        document.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('sheet-contact');
            const openBtn = document.getElementById('open-contact-sheet-btn');
            const closeBtn = document.getElementById('sheet-contact-close-btn');

            if (openBtn && sheet) {
                openBtn.addEventListener('click', () => sheet.classList.add('active'));
            }
            if (closeBtn && sheet) {
                closeBtn.addEventListener('click', () => sheet.classList.remove('active'));
            }
            if (sheet) {
                sheet.addEventListener('click', (e) => {
                    if (e.target === sheet) sheet.classList.remove('active');
                });
            }
        });
    </script>

    <script src="auth.js?v=3.5"></script>
    <script src="viewer.js?v=4.0" defer></script>
    <script src="cookie-consent.js" defer></script>
    <script src="error-reporter.js" defer></script>
    <script src="js/sw-register.js"></script>
    <script src="premium-ui.js" defer></script>
</body>
</html>
